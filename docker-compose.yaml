---
x-pola-backend-common:
  &pola-backend-common
  build:
    context: .
    dockerfile: scripts/ci-docker-image/Dockerfile
    args:
      - DJANGO_VERSION=${DJANGO_VERSION-5.1.8}
      - PYTHON_VERSION=${PYTHON_VERSION-3.11}
  image: pola-backend_web:latest
  environment:
    DATABASE_URL: '${DATABASE_URL:-postgres://pola_app:pola_app@postgres/pola_app}'
    AI_SHARED_SECRET: '123123'
    DJANGO_DEBUG: 'True'
    IS_PRODUCTION: 'False'
    SLACK_CHANNEL_AI_STATS: 'ai-stats'
    WEB_CONCURRENCY: '6'
    WHITELIST_API_IP_ADDRESSES: '10.0.0.1'
    POLA_APP_GCS_PUBLIC_BUCKET_NAME: 'pola-app-public'
    POLA_APP_GCS_BACKEND_BUCKET_NAME: 'pola-app-backend'
    POLA_APP_GCS_AI_PICS_BUCKET_NAME: 'pola-app-ai-pics'
    POLA_APP_GCS_COMPANY_LOGOTYPE_BUCKET_NAME: 'pola-app-company-logotype'
    POLA_APP_GCS_WEB_BUCKET_NAME: 'pola-web-public'
    POLA_APP_GCS_PUBLIC_BASE_URL: 'http://localhost:4443'
    STORAGE_EMULATOR_HOST: 'http://fake-gcs-server:4443'
    USE_GCS_STORAGE: 'True'

  env_file: .env
  volumes:
    - .:/app

services:
  web:
    <<: *pola-backend-common
    depends_on:
      postgres:
        condition: service_healthy
      fake-gcs-init:
        condition: service_completed_successfully
      web-collectstatic:
        condition: service_completed_successfully
      web-compile-assets:
        condition: service_completed_successfully
    command: runserver 0.0.0.0:8080
    ports:
      - "8080:8080"
    restart: always

  self-management:
    build:
      context: ./self-management
      args:
        - PYTHON_VERSION=${PYTHON_VERSION-3.11}
    image: pola-backend_self-management:latest

    env_file: .env
    volumes:
      - ./self-management/:/app/
    ports:
      - "8501:8501"
    expose:
      - 8501
    restart: always

  web-collectstatic:
    <<: *pola-backend-common
    restart: "no"
    depends_on:
      web-compile-assets:
        condition: service_completed_successfully
      fake-gcs-init:
        condition: service_completed_successfully
    command: ./manage.py collectstatic --no-input

  web-compile-assets:
    image: node:17.3.0-alpine3.12
    volumes:
      - .:/app
    working_dir: /app
    restart: "no"
    command: sh -c "npm install && npm run build"

  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -port 4443 -backend memory
    restart: always
    ports:
      - "4443:4443"
    expose:
      - 4443

  fake-gcs-init:
    image: curlimages/curl:8.17.0
    restart: "no"
    depends_on:
      fake-gcs-server:
        condition: service_started
    command:
      - sh
      - -ec
      - |
        until curl -sS "http://fake-gcs-server:4443/storage/v1/b?project=pola-local" >/dev/null; do sleep 1; done
        endpoint="http://fake-gcs-server:4443/storage/v1/b?project=pola-local"
        for bucket in pola-app-public pola-app-backend pola-app-ai-pics pola-web-public pola-app-company-logotype; do
          curl -sS -X POST "$${endpoint}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$${bucket}\"}" || true
        done

  postgres:
    image: postgres:18.0
    restart: always
    environment:
      POSTGRES_USER: pola_app
      POSTGRES_PASSWORD: pola_app
      POSTGRES_DB: pola_app
    ports:
      - 5432:5432
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-U", "pola_app", "-c", "select 1", "pola_app"]
      interval: 30s
      retries: 5

volumes:
  postgres-data:
