---
x-pola-backend-common:
  &pola-backend-common
  build:
    context: .
    dockerfile: scripts/ci-docker-image/Dockerfile
    args:
      - DJANGO_VERSION=${DJANGO_VERSION-5.1.8}
      - PYTHON_VERSION=${PYTHON_VERSION-3.11}
  image: pola-backend_web:latest
  environment:
    DATABASE_URL: '${DATABASE_URL:-postgres://pola_app:pola_app@postgres/pola_app}'
    AI_SHARED_SECRET: '123123'
    DJANGO_DEBUG: 'True'
    IS_PRODUCTION: 'False'
    SLACK_CHANNEL_AI_STATS: 'ai-stats'
    WEB_CONCURRENCY: '6'
    WHITELIST_API_IP_ADDRESSES: '10.0.0.1'

  env_file: .env
  volumes:
    - .:/app

services:
  web:
    <<: *pola-backend-common
    depends_on:
      postgres:
        condition: service_healthy
      web-collectstatic:
        condition: service_completed_successfully
      web-compile-assets:
        condition: service_completed_successfully
    command: runserver 0.0.0.0:8080
    ports:
      - "8080:8080"
    restart: always

  self-management:
    build:
      context: ./self-management
      args:
        - PYTHON_VERSION=${PYTHON_VERSION-3.11}
    image: pola-backend_self-management:latest

    env_file: .env
    volumes:
      - ./self-management/:/app/
    ports:
      - "8501:8501"
    expose:
      - 8501
    restart: always

  web-collectstatic:
    <<: *pola-backend-common
    restart: "no"
    depends_on:
      web-compile-assets:
        condition: service_completed_successfully
    command: ./manage.py collectstatic --no-input

  web-compile-assets:
    image: node:17.3.0-alpine3.12
    volumes:
      - .:/app
    working_dir: /app
    restart: "no"
    command: sh -c "npm install && npm run build"

  postgres:
    image: postgres:18.0
    restart: always
    environment:
      POSTGRES_USER: pola_app
      POSTGRES_PASSWORD: pola_app
      POSTGRES_DB: pola_app
    ports:
      - 5432:5432
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-U", "pola_app", "-c", "select 1", "pola_app"]
      interval: 30s
      retries: 5

volumes:
  postgres-data:
